<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - صالون الحلاقة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1512 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: #d4af7a;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .header p {
            color: #b89a6e;
        }
        .card {
            background: #fff8f0;
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #3a2a1f;
        }
        input, select {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid #e0cfbf;
            border-radius: 50px;
            font-size: 1rem;
            background: white;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #d4af7a;
        }
        button {
            background: #8b691b;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        button:hover {
            background: #6b4f12;
            transform: scale(0.98);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #e0cfbf;
        }
        th {
            background: #f5ede3;
            color: #5a3e2a;
        }
        .cancel-btn {
            background: #c0392b;
            padding: 5px 12px;
            font-size: 0.85rem;
        }
        .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .status-pending {
            background: #f39c12;
            color: white;
        }
        .status-completed {
            background: #27ae60;
            color: white;
        }
        .footer {
            text-align: center;
            color: #8f7a68;
            margin-top: 30px;
        }
        @media (max-width: 768px) {
            .card { padding: 20px; }
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>✂️ صالون الحلاقة الملكي</h1>
        <p>احجز موعدك الآن بأفضل الخدمات والأسعار</p>
    </div>

    <div class="card">
        <h2 style="margin-bottom: 20px; color:#5a3e2a;">📅 حجز موعد جديد</h2>
        <div class="form-group">
            <label>👤 الاسم الكامل</label>
            <input type="text" id="customerName" placeholder="أدخل اسمك">
        </div>
        <div class="form-group">
            <label>💈 اختيار الخدمة</label>
            <select id="serviceSelect"></select>
        </div>
        <div class="form-group">
            <label>📅 التاريخ</label>
            <input type="date" id="bookingDate">
        </div>
        <div class="form-group">
            <label>⏰ الوقت</label>
            <input type="time" id="bookingTime">
        </div>
        <div class="form-group">
            <label>👨‍🦰 اختيار الحلاق</label>
            <select id="barberSelect"></select>
        </div>
        <button id="bookBtn">✅ تأكيد الحجز</button>
    </div>

    <div class="card">
        <h2 style="margin-bottom: 20px; color:#5a3e2a;">📋 مواعيدي القادمة</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>الخدمة</th>
                        <th>التاريخ</th>
                        <th>الوقت</th>
                        <th>الحلاق</th>
                        <th>السعر</th>
                        <th>الحالة</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="reservationsTable"></tbody>
            </table>
        </div>
    </div>
    <div class="footer">
        <p>🔐 هذه الصفحة مخصصة للعملاء فقط | للإدارة والدخول إلى لوحة التحكم <a href="employee.html" style="color:#8b691b;">اضغط هنا</a></p>
    </div>
</div>

<script>
    // مفتاح التخزين المحلي
    const STORAGE_KEYS = {
        reservations: 'barber_reservations_customer',
        services: 'barber_services_config',
        barbers: 'barber_employees_config',
        revenue: 'barber_revenue',
        customersServed: 'barber_customers_count'
    };

    // تحميل البيانات الافتراضية إذا لم توجد
    function loadDefaultData() {
        if (!localStorage.getItem(STORAGE_KEYS.services)) {
            const defaultServices = [
                { id: 1, name: "قص شعر رجالي", price: 25 },
                { id: 2, name: "حلاقة اللحية", price: 15 },
                { id: 3, name: "حلاقة كاملة (شعر + لحية)", price: 35 },
                { id: 4, name: "قص أطفال", price: 18 },
                { id: 5, name: "صفائح وحلاقة فاخرة", price: 45 }
            ];
            localStorage.setItem(STORAGE_KEYS.services, JSON.stringify(defaultServices));
        }

        if (!localStorage.getItem(STORAGE_KEYS.barbers)) {
            const defaultBarbers = [
                { id: 1, name: "محمد (حلاق أول)", salary: 500 },
                { id: 2, name: "أحمد (حلاق محترف)", salary: 450 },
                { id: 3, name: "خالد (حلاق متميز)", salary: 400 }
            ];
            localStorage.setItem(STORAGE_KEYS.barbers, JSON.stringify(defaultBarbers));
        }

        if (!localStorage.getItem(STORAGE_KEYS.reservations)) {
            localStorage.setItem(STORAGE_KEYS.reservations, JSON.stringify([]));
        }

        if (!localStorage.getItem(STORAGE_KEYS.revenue)) {
            localStorage.setItem(STORAGE_KEYS.revenue, "0");
        }

        if (!localStorage.getItem(STORAGE_KEYS.customersServed)) {
            localStorage.setItem(STORAGE_KEYS.customersServed, "0");
        }
    }

    function getServices() {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.services));
    }

    function getBarbers() {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.barbers));
    }

    function getReservations() {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.reservations));
    }

    function saveReservations(reservations) {
        localStorage.setItem(STORAGE_KEYS.reservations, JSON.stringify(reservations));
    }

    function getServicePrice(serviceName) {
        const services = getServices();
        const service = services.find(s => s.name === serviceName);
        return service ? service.price : 25;
    }

    // عرض الحجوزات للعميل الحالي (بناءً على الاسم)
    function loadCustomerReservations() {
        const currentCustomer = document.getElementById('customerName').value.trim();
        if (!currentCustomer) {
            document.getElementById('reservationsTable').innerHTML = '<tr><td colspan="7" style="text-align:center;">أدخل اسمك لعرض حجوزاتك</td></tr>';
            return;
        }

        const allReservations = getReservations();
        const myReservations = allReservations.filter(r => r.customerName === currentCustomer);
        
        const tbody = document.getElementById('reservationsTable');
        if (myReservations.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">لا توجد حجوزات حالية</td></tr>';
            return;
        }

        tbody.innerHTML = '';
        myReservations.forEach(res => {
            const row = tbody.insertRow();
            row.insertCell(0).innerText = res.service;
            row.insertCell(1).innerText = res.date;
            row.insertCell(2).innerText = res.time;
            row.insertCell(3).innerText = res.barber;
            row.insertCell(4).innerText = `$${res.price}`;
            row.insertCell(5).innerHTML = `<span class="status ${res.status === 'pending' ? 'status-pending' : 'status-completed'}">${res.status === 'pending' ? 'قيد الانتظار' : 'تم التنفيذ'}</span>`;
            
            const cancelCell = row.insertCell(6);
            if (res.status === 'pending') {
                const cancelBtn = document.createElement('button');
                cancelBtn.innerText = 'إلغاء';
                cancelBtn.className = 'cancel-btn';
                cancelBtn.style.background = '#c0392b';
                cancelBtn.style.padding = '5px 12px';
                cancelBtn.style.borderRadius = '25px';
                cancelBtn.style.border = 'none';
                cancelBtn.style.color = 'white';
                cancelBtn.style.cursor = 'pointer';
                cancelBtn.onclick = () => cancelReservation(res.id, currentCustomer);
                cancelCell.appendChild(cancelBtn);
            } else {
                cancelCell.innerText = '—';
            }
        });
    }

    function cancelReservation(resId, customerName) {
        if (confirm('هل أنت متأكد من إلغاء هذا الحجز؟')) {
            let allReservations = getReservations();
            allReservations = allReservations.filter(r => !(r.id === resId && r.customerName === customerName));
            saveReservations(allReservations);
            loadCustomerReservations();
            alert('تم إلغاء الحجز بنجاح');
        }
    }

    function addReservation() {
        const name = document.getElementById('customerName').value.trim();
        const service = document.getElementById('serviceSelect').value;
        const date = document.getElementById('bookingDate').value;
        const time = document.getElementById('bookingTime').value;
        const barber = document.getElementById('barberSelect').value;

        if (!name || !service || !date || !time || !barber) {
            alert('الرجاء ملء جميع الحقول');
            return;
        }

        const price = getServicePrice(service);
        const newReservation = {
            id: Date.now() + '_' + Math.random(),
            customerName: name,
            service: service,
            date: date,
            time: time,
            barber: barber,
            price: price,
            status: 'pending'
        };

        const allReservations = getReservations();
        allReservations.push(newReservation);
        saveReservations(allReservations);
        
        alert('تم حجز الموعد بنجاح!');
        document.getElementById('bookingDate').value = '';
        document.getElementById('bookingTime').value = '';
        loadCustomerReservations();
    }

    function populateDropdowns() {
        const services = getServices();
        const serviceSelect = document.getElementById('serviceSelect');
        serviceSelect.innerHTML = '';
        services.forEach(s => {
            const option = document.createElement('option');
            option.value = s.name;
            option.textContent = `${s.name} - $${s.price}`;
            serviceSelect.appendChild(option);
        });

        const barbers = getBarbers();
        const barberSelect = document.getElementById('barberSelect');
        barberSelect.innerHTML = '';
        barbers.forEach(b => {
            const option = document.createElement('option');
            option.value = b.name;
            option.textContent = b.name;
            barberSelect.appendChild(option);
        });
    }

    // تهيئة الصفحة
    loadDefaultData();
    populateDropdowns();
    
    // تعيين التاريخ الحالي كقيمة افتراضية
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('bookingDate').value = today;
    document.getElementById('bookingTime').value = '16:00';
    
    document.getElementById('bookBtn').onclick = addReservation;
    document.getElementById('customerName').oninput = loadCustomerReservations;
</script>
</body>
</html>
